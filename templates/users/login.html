{% extends "base.html" %}
{% load static %}
{% block title %}
Login
{% endblock %}

{% block content %}
<section
  class="flex justify-center items-center w-full min-h-screen py-[200px]"
  style="
    background-image: url('{% static 'images/bgimg.png' %}');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
  "
>
  <form class="border p-2 rounded shadow bg-dark flex flex-col gap-y-[20px]" method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label for="{{ form.username.id_for_label }}" class="block text-white font-semibold mb-2">Username</label>
      {{ form.username }}
    </div>

    <div class="form-group">
      <label for="{{ form.password.id_for_label }}" class="block text-white font-semibold mb-2">Password</label>
      {{ form.password }}
    </div>

    <div class="flex flex-col gap-y-[20px]">
      <button
        type="submit"
        data-mdb-button-init
        data-mdb-ripple-init
        class="w-full border rounded shadow hover:bg-red-200"
      >
        Sign in
      </button>
      <p class="text-white">
        Not a member?
        <a href="{% url 'users:register' %}" class="underline text-blue-300 hover:text-blue-400">Register</a>
      </p>
    </div>
  </form>
</section>
{% endblock %}
